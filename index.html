<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日運勢占卜</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin-top: 100px; 
            background-color: #fdf6e3;
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #27ae60;
        }
        #result { 
            margin-top: 30px; 
            font-size: 28px; 
            font-weight: bold; 
            color: #e74c3c; 
        }
    </style>
</head>
<body>
    <h1>🔮 今日運勢抽籤 🔮</h1>
    <p>點擊下方按鈕，看看你今天的運氣如何！</p>
    <button onclick="drawFortune()">開始占卜</button>
    <div id="result"></div>

    <script>
        // 這是負責抽籤邏輯的 JavaScript
        function drawFortune() {
            const fortunes = ["大吉 🌟🌟🌟", "中吉 ☀️☀️", "小吉 🌤️", "平 😊", "凶 🌧️", "大凶 ⛈️ (記得多喝水)"];
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            document.getElementById("result").innerText = "你的運勢是：" + fortunes[randomIndex];
        }
    </script>
</body>
</html>
